<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Intake</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 12h12v11a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2zM13 12V9.5A1.5 1.5 0 0 1 14.5 8h3A1.5 1.5 0 0 1 19 9.5V12' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">⌘</div><span>Job Intake</span></div>
    <label class="search">
      <span class="sr-only">Search jobs</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder='Search… e.g. "data engineer" is:remote pay:150k+ has:email' autocomplete="off" spellcheck="false">
      <button class="qhelp" data-help type="button" title="Search tips" aria-label="Search tips">?</button>
    </label>
    <div class="top-right">
      <button class="btn" id="refreshBtn" title="Fetch fresh jobs from every source">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span id="refreshLabel">Refresh</span>
      </button>
      <button class="btn" id="profileBtn" title="Your profile (drives match scores)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span class="hide-sm">Profile</span>
      </button>
      <button class="btn icon ghost" id="themeBtn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="foryou">For you <span class="count" id="c-foryou"></span></button>
    <button class="tab" role="tab" data-view="all">All jobs <span class="count" id="c-all"></span></button>
    <button class="tab" role="tab" data-view="new">New <span class="count" id="c-new"></span></button>
    <button class="tab" role="tab" data-view="pipeline">My pipeline <span class="count" id="c-pipeline"></span></button>
    <button class="tab" role="tab" data-view="insights">Insights</button>
    <button class="tab" role="tab" data-view="changes">Changes</button>
    <button class="tab" role="tab" data-view="api">API &amp; AI</button>
  </nav>

  <main id="main"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
